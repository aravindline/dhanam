plugins { id 'com.android.application' }
android {
    namespace 'in.aravindline.dhanam'
    compileSdk 35
    defaultConfig {
        applicationId 'in.aravindline.dhanam'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }
    signingConfigs {
        release {
            // From GitHub secrets (see README). The same key must sign every version so updates install over the old one.
            def ks = System.getenv('DHANAM_KEYSTORE_FILE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('DHANAM_KEYSTORE_PASSWORD')
                keyAlias 'dhanam'
                keyPassword System.getenv('DHANAM_KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            // without the secrets (e.g. a first trial), fall back to the build machine's debug key
            signingConfig System.getenv('DHANAM_KEYSTORE_FILE') ? signingConfigs.release : signingConfigs.debug
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
