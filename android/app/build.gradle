plugins { id 'com.android.application' }
android {
    namespace 'in.aravindline.dhanam'
    compileSdk 35
    defaultConfig {
        applicationId 'in.aravindline.dhanam'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }
    buildTypes {
        release {
            minifyEnabled false
            // signed with the build machine's own key (no secrets to set up). To install a newer build later,
            // uninstall the old one first.
            signingConfig signingConfigs.debug
        }
    }
    lint { checkReleaseBuilds false; abortOnError false }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
