# Builds the தனம் reminder Android app (android/ folder) and publishes the APK on the Releases page.
# Runs by itself when the android folder is uploaded or changed, or by hand: Actions > Build Android reminder > Run workflow.
name: Build Android reminder
on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10.2' }
      - name: Build APK
        working-directory: android
        run: gradle --no-daemon assembleRelease
      - name: Name the APK
        run: |
          V=$(grep versionName android/app/build.gradle | grep -o "'[^']*'" | tr -d "'")
          echo "V=$V" >> "$GITHUB_ENV"
          cp android/app/build/outputs/apk/release/app-release.apk "Dhanam-Reminder-$V.apk"
      - uses: actions/upload-artifact@v4
        with: { name: Dhanam-Reminder-APK, path: 'Dhanam-Reminder-*.apk' }
      - name: Publish release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release delete "android-v$V" --yes --cleanup-tag 2>/dev/null || true
          gh release create "android-v$V" "Dhanam-Reminder-$V.apk" --title "தனம் நினைவூட்டல் $V" --notes "Daily 8 pm reminder for தனம். Open this page on the phone, tap the .apk and install."
